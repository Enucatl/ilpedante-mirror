name: Update archive

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Download latest articles
        run: uv run bulk_download --incremental https://ilpedante.info/home/loadArticoli

      - name: Rebuild archive
        run: uv run build_archive

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts
          if git diff --cached --quiet; then
            echo "Archive is already up to date."
            git commit --allow-empty -m "Keep archive updater active"
          else
            git commit -m "Update archived articles"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
